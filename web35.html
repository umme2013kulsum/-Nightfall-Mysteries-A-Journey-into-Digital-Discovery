<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confidential</title>
    <style>
    
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    background:#000;
    overflow:hidden;
    font-family:Georgia,serif;
}

body.lock{
    overflow:hidden;
}

/*=====================================
            INTRO SCREEN
======================================*/

#vaultIntro{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:
    radial-gradient(circle at center,#090909 0%,#000 75%);
    z-index:999999;
    transition:opacity 2s ease;
}

/*=====================================
            STAR FIELD
======================================*/

#vaultIntro::before{

    content:"";

    position:absolute;
    inset:-50%;

    background-image:

    radial-gradient(2px 2px at 10% 20%,white 50%,transparent),
    radial-gradient(1.5px 1.5px at 25% 80%,white 50%,transparent),
    radial-gradient(2px 2px at 40% 30%,white 50%,transparent),
    radial-gradient(2px 2px at 70% 15%,white 50%,transparent),
    radial-gradient(1.5px 1.5px at 85% 60%,white 50%,transparent),
    radial-gradient(2px 2px at 60% 90%,white 50%,transparent),
    radial-gradient(1.5px 1.5px at 15% 65%,white 50%,transparent),
    radial-gradient(2px 2px at 90% 35%,white 50%,transparent),
    radial-gradient(1.5px 1.5px at 55% 45%,white 50%,transparent),
    radial-gradient(2px 2px at 35% 55%,white 50%,transparent);

    background-size:700px 700px;

    opacity:.35;

    animation:starsMove 80s linear infinite;

}

/*=====================================
            VIGNETTE
======================================*/

#vaultIntro::after{

content:"";

position:absolute;

inset:0;

background:radial-gradient(circle,
transparent 45%,
rgba(0,0,0,.55) 100%);

pointer-events:none;

}

/*=====================================
            TEXT
======================================*/

#vaultText{

position:relative;

z-index:5;

width:min(90%,900px);

padding:25px;

text-align:center;

font-size:clamp(2rem,6vw,3.6rem);

letter-spacing:clamp(2px,.5vw,8px);

line-height:1.45;

color:white;

text-transform:uppercase;

opacity:0;

transition:opacity .8s ease;

word-break:break-word;

overflow-wrap:break-word;

text-shadow:
0 0 10px rgba(255,255,255,.8),
0 0 25px #8b5cf6,
0 0 55px #4b0082;

animation:flicker 3s infinite;

}

/*=====================================
            STARS
======================================*/

@keyframes starsMove{

from{

transform:translateY(0);

}

to{

transform:translateY(-500px);

}

}

/*=====================================
            FLICKER
======================================*/

@keyframes flicker{

0%,100%{

opacity:1;

}

48%{

opacity:.92;

}

50%{

opacity:.55;

}

52%{

opacity:1;

}

}

/*=====================================
        TABLETS
======================================*/

@media (max-width:900px){

#vaultText{

width:90%;

padding:20px;

}

}

/*=====================================
        MOBILE
======================================*/

@media (max-width:600px){

#vaultText{

font-size:clamp(1.6rem,8vw,2.3rem);

letter-spacing:2px;

line-height:1.5;

padding:18px;

}

}

/*=====================================
    SMALL PHONES
======================================*/

@media (max-width:380px){

#vaultText{

font-size:1.45rem;

padding:15px;

}

}
</style>
</head>
<body>
    

<div id="vaultIntro">
    <div id="vaultText"></div>
</div>

<script>


/* ================= SECRET VAULT INTRO ================= */

document.body.classList.add("lock");

const intro = document.getElementById("vaultIntro");
const text = document.getElementById("vaultText");

const messages = [


    "Night falls...",

    "The internet has secrets.",

    "Some were never meant to be found.",

    "Forgotten places...",

    "Abandoned websites...",

    "Some things are hidden for good...",

    "🗣️:What is it?",

    "It's always watching your every search.",

    "🗣️:Why is it watching me?",

    "...",

    "THE SECRET VAULT",

    "You weren't supposed to find this.",

    "If you're reading this... it's already too late.",

    "Someone knows you're here.",

    "Erase your tracks.",

    "...",

    "They're coming.",

    "This transmission has been compromised.",

    "Connection terminated.",

    "GOODBYE."

];



let current = 0;

function playIntro() {

    text.style.opacity = "0";

    setTimeout(() => {

        text.innerHTML = messages[current];

        text.style.opacity = "1";

        let wait = 1600;

        // Longer pause for important messages
        if (messages[current] === "THE SECRET VAULT") {
            wait = 2600;
        }

        if (messages[current] === "...") {
            wait = 900;
        }

        if (messages[current] === "GOODBYE.") {
            wait = 1800;
        }

        current++;

        if (current < messages.length) {

            setTimeout(playIntro, wait);

        } else {

            setTimeout(() => {

                intro.style.opacity = "0";

                document.body.classList.remove("lock");

                setTimeout(() => {

                    window.location.href = "index.html";

                }, 2000);

            }, 1500);

        }

    }, 500);

}

window.addEventListener("load", playIntro);
</script>

</body>
</html>
